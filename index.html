<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd6e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Iron Issues</title>
<style>
:root{
  --bg:#fff5f8;--card:#ffffff;--ink:#3b1f2e;--muted:#9a7a8a;--line:#f6d9e4;
  --accent:#e0457b;--accent-soft:#fde2ec;--good:#2a9d8f;--good-soft:#d9f3ef;
  --warn:#c77dff;--warn-soft:#efe1ff;--bad:#e5484d;--bad-soft:#ffe1e3;
  --radius:18px;--tap:48px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1c1118;--card:#271a23;--ink:#fbeef4;--muted:#b899a8;--line:#3f2a37;
  --accent:#ff7eb0;--accent-soft:#4a2338;--good:#5fd3c3;--good-soft:#173833;
  --warn:#d6a3ff;--warn-soft:#352247;--bad:#ff8a8f;--bad-soft:#4a2224;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{padding:calc(14px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:flex-end;justify-content:space-between;background:linear-gradient(135deg,#ffd6e5 0%,#efe1ff 100%);border-radius:0 0 24px 24px;margin-bottom:14px}
@media (prefers-color-scheme:dark){header{background:linear-gradient(135deg,#4a2338 0%,#352247 100%)}}
header .brand{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
header h1{margin:2px 0 0;font-size:24px;letter-spacing:-.02em}
header .date{color:var(--muted);font-size:13px;text-align:right}
button{box-shadow:0 2px 8px rgba(224,69,123,.18)}
button.ghost,nav button,.chip,.done{box-shadow:none}
.card{box-shadow:0 1px 3px rgba(224,69,123,.06)}
main{padding:0 16px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:17px}
.card h3{margin:0 0 6px;font-size:15px}
.muted{color:var(--muted);font-size:14px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1}
button{font:inherit;border:0;border-radius:12px;min-height:var(--tap);padding:0 16px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--line)}
button.small{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
button.block{width:100%}
button:disabled{opacity:.45}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1;min-width:0;min-height:var(--tap);border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;padding:8px 10px;text-align:center;font-size:14px}
.chip small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
.chip.on{border-color:var(--accent);background:var(--accent-soft)}
.chip.good.on{border-color:var(--good);background:var(--good-soft)}
.chip.warn.on{border-color:var(--warn);background:var(--warn-soft)}
.chip.bad.on{border-color:var(--bad);background:var(--bad-soft)}
.banner{border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:12px}
.banner.good{background:var(--good-soft)}.banner.warn{background:var(--warn-soft)}.banner.bad{background:var(--bad-soft)}
.ex{border-top:1px solid var(--line);padding:14px 0}
.ex:first-of-type{border-top:0;padding-top:4px}
.ex .title{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ex .title b{font-size:16px}
.ex .meta{color:var(--muted);font-size:13px;margin-top:2px}
.ex .note{font-size:13px;margin-top:6px;padding:8px 10px;border-radius:10px;background:var(--warn-soft)}
.howto{display:inline-block;font-size:12px;color:var(--accent);text-decoration:underline;margin-top:4px}
.ex .swap{font-size:12px;color:var(--accent);margin-top:4px}
.sets{margin-top:10px;display:grid;gap:6px}
.sethead,.set{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:8px;align-items:center}
.sethead{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.set .n{color:var(--muted);font-size:13px;text-align:center}
input[type=number],input[type=text],select,textarea{font:inherit;width:100%;min-height:44px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);color:var(--ink)}
input[type=number]{text-align:center;font-size:17px;-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none}
textarea{min-height:70px;resize:vertical}
.done{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:transparent;font-size:20px;padding:0}
.done.on{background:var(--good);border-color:var(--good);color:#fff}
.equip{margin-top:8px}
.equip select{min-height:40px;font-size:14px}
.addset{margin-top:8px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;background:transparent;color:var(--muted);border-radius:0;min-height:60px;font-size:12px;font-weight:600;display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center}
nav button span{font-size:20px}
nav button.on{color:var(--accent)}
.week{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.slot{border:1.5px dashed var(--line);border-radius:10px;padding:10px 6px;text-align:center;font-size:12px;color:var(--muted)}
.slot.hit{border-style:solid;border-color:var(--good);background:var(--good-soft);color:var(--ink)}
.sess{border-top:1px solid var(--line);padding:12px 0}
.sess summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sess summary::-webkit-details-marker{display:none}
.tag{font-size:11px;padding:3px 8px;border-radius:999px;background:var(--line);font-weight:600}
.tag.good{background:var(--good-soft)}.tag.warn{background:var(--warn-soft)}.tag.bad{background:var(--bad-soft)}
.sess table{width:100%;font-size:13px;border-collapse:collapse;margin-top:8px}
.sess td{padding:4px 0;vertical-align:top}
.sess td:last-child{text-align:right;color:var(--muted)}
.last{font-size:12px;color:var(--good);margin-top:4px}
.steps{padding-left:20px;margin:6px 0;font-size:14px}
.steps li{margin-bottom:6px}
.hidden{display:none}
footer{text-align:center;color:var(--muted);font-size:12px;padding:16px}
</style>
</head>
<body>
<header><div><div class="brand">Iron Issues 🩸💪</div><h1 id="title">Today</h1></div><div class="date" id="today"></div></header>
<main id="app"></main>
<nav>
  <button data-tab="today" class="on"><span>●</span>Today</button>
  <button data-tab="insights"><span>◔</span>Insights</button>
  <button data-tab="history"><span>▤</span>History</button>
  <button data-tab="program"><span>≡</span>Program</button>
  <button data-tab="settings"><span>⚙</span>Settings</button>
</nav>

<script>
/* ========== PROGRAM ==========
   Each exercise: name, equip (default), sets, reps, rest, note.
   mild: changes applied when "A bit off" is selected.
   dizzyOnly: true = keep in the light/recovery session ("Dizzy").
*/
const EQUIP = ['barbell','dumbbell','machine','cable','kettlebell','bodyweight','smith','band'];
const PROGRAM = {
  lowerA:{name:'Lower A',focus:'Hinge / posterior chain',exercises:[
    {name:'Romanian deadlift',equip:'barbell',sets:4,reps:'5–6',rest:'3 min',note:'Exhale on the way up. Walk 30 s after each set.',mild:{sets:3,note:'Top sets cut to 3. Dumbbells if the bar feels heavy to set up.'}},
    {name:'Hip thrust',equip:'barbell',sets:3,reps:'8–10',rest:'2 min',note:'Sit up slowly between sets.',mild:{name:'Dumbbell glute bridge',equip:'dumbbell',reps:'10–12'},dizzyOnly:true},
    {name:'Leg press (shallow)',equip:'machine',sets:3,reps:'10–12',rest:'2 min',note:'Feet high. No breath-hold.',dizzyOnly:true},
    {name:'Seated hamstring curl',equip:'machine',sets:3,reps:'10–12',rest:'90 s',dizzyOnly:true},
    {name:'Cable pull-through',equip:'cable',sets:3,reps:'12–15',rest:'90 s',note:'Replaces back extensions.',mild:{sets:2}},
    {name:'Seated calf raise',equip:'machine',sets:3,reps:'12–15',rest:'60 s',dizzyOnly:true},
    {name:'Dead bug',equip:'bodyweight',sets:3,reps:'10/side',rest:'60 s',note:'Sit up slowly after.',mild:{sets:2}}
  ]},
  upperA:{name:'Upper A',focus:'Push emphasis',exercises:[
    {name:'Bench press (flat)',equip:'barbell',sets:4,reps:'5–6',rest:'3 min',note:'Exhale on the press. Sit 20 s before standing.',mild:{sets:3,name:'Dumbbell bench press',equip:'dumbbell',reps:'6–8'}},
    {name:'Seated dumbbell shoulder press',equip:'dumbbell',sets:3,reps:'8–10',rest:'2 min',note:'Back support on.',mild:{name:'Machine shoulder press',equip:'machine'},dizzyOnly:true},
    {name:'Chest-supported row',equip:'dumbbell',sets:3,reps:'8–10',rest:'2 min',note:'Lift head off the pad slowly.',dizzyOnly:true},
    {name:'Incline dumbbell press',equip:'dumbbell',sets:3,reps:'10–12',rest:'90 s',mild:{sets:2}},
    {name:'Lat pulldown (wide)',equip:'cable',sets:3,reps:'10–12',rest:'90 s',dizzyOnly:true},
    {name:'Cable lateral raise',equip:'cable',sets:3,reps:'12–15',rest:'60 s',dizzyOnly:true},
    {name:'Triceps pushdown',equip:'cable',sets:3,reps:'12–15',rest:'60 s',dizzyOnly:true},
    {name:'Face pull',equip:'cable',sets:2,reps:'15–20',rest:'60 s'}
  ]},
  lowerB:{name:'Lower B',focus:'Quad / glute',exercises:[
    {name:'Front squat',equip:'barbell',sets:4,reps:'6–8',rest:'3 min',note:'No breath-hold past 2 reps.',mild:{name:'Leg press (full range)',equip:'machine',sets:3,note:'Machine instead of the bar today.'}},
    {name:'Bulgarian split squat',equip:'dumbbell',sets:3,reps:'8–10/leg',rest:'2 min',note:'One hand on the rack for heavy sets.',mild:{name:'Step-ups (hold rail)',sets:2,reps:'10/leg'}},
    {name:'Hip thrust',equip:'barbell',sets:3,reps:'10–12',rest:'2 min',note:'Sit up slowly.',mild:{name:'Dumbbell glute bridge',equip:'dumbbell'},dizzyOnly:true},
    {name:'Leg extension',equip:'machine',sets:3,reps:'12–15',rest:'90 s',dizzyOnly:true},
    {name:'Single-leg RDL',equip:'dumbbell',sets:3,reps:'10/leg',rest:'90 s',note:'Light. Balance work.',mild:{sets:2}},
    {name:'Hip abduction',equip:'machine',sets:3,reps:'15',rest:'60 s',dizzyOnly:true},
    {name:'Standing calf raise',equip:'machine',sets:3,reps:'12–15',rest:'60 s',note:'Hold the rack; step off slowly.',mild:{name:'Seated calf raise'},dizzyOnly:true},
    {name:'Pallof press',equip:'cable',sets:3,reps:'12/side',rest:'60 s',mild:{sets:2}}
  ]},
  upperB:{name:'Upper B',focus:'Pull emphasis',exercises:[
    {name:'Seated cable row',equip:'cable',sets:4,reps:'6–8',rest:'3 min',note:'Exhale as you pull.',mild:{sets:3},dizzyOnly:true},
    {name:'Lat pulldown (neutral)',equip:'cable',sets:3,reps:'8–10',rest:'2 min',note:'No strict pull-ups on dizzy weeks.',dizzyOnly:true},
    {name:'Dumbbell bench press',equip:'dumbbell',sets:3,reps:'10–12',rest:'2 min',note:'Sit 20 s before standing.',mild:{name:'Machine chest press',equip:'machine'},dizzyOnly:true},
    {name:'Single-arm dumbbell row',equip:'dumbbell',sets:3,reps:'10–12/arm',rest:'90 s',note:'Hand on bench, head level.',mild:{sets:2}},
    {name:'Seated Arnold press (light)',equip:'dumbbell',sets:3,reps:'12',rest:'90 s',mild:{sets:2}},
    {name:'Rear-delt fly',equip:'machine',sets:3,reps:'15',rest:'60 s',dizzyOnly:true},
    {name:'Incline dumbbell curl',equip:'dumbbell',sets:3,reps:'10–12',rest:'60 s',note:'Sit up slowly off the incline.',dizzyOnly:true},
    {name:'Overhead cable triceps extension',equip:'cable',sets:3,reps:'12–15',rest:'60 s',dizzyOnly:true}
  ]}
};
const DAY_ORDER = ['lowerA','upperA','lowerB','upperB'];
const LOWER_DAYS = ['lowerA','lowerB'];
/* Muscle group per exercise name (swapped-in names included) */
const MUSCLE = {
  'Romanian deadlift':'Hamstrings','Hip thrust':'Glutes','Dumbbell glute bridge':'Glutes','Leg press (shallow)':'Quads','Leg press (full range)':'Quads',
  'Seated hamstring curl':'Hamstrings','Cable pull-through':'Glutes','Seated calf raise':'Calves','Standing calf raise':'Calves','Dead bug':'Core','Pallof press':'Core',
  'Front squat':'Quads','Bulgarian split squat':'Quads','Step-ups (hold rail)':'Quads','Leg extension':'Quads','Single-leg RDL':'Hamstrings','Hip abduction':'Glutes',
  'Bench press (flat)':'Chest','Dumbbell bench press':'Chest','Machine chest press':'Chest','Incline dumbbell press':'Chest',
  'Seated dumbbell shoulder press':'Shoulders','Machine shoulder press':'Shoulders','Cable lateral raise':'Shoulders','Seated Arnold press (light)':'Shoulders','Rear-delt fly':'Shoulders','Face pull':'Shoulders',
  'Chest-supported row':'Back','Lat pulldown (wide)':'Back','Lat pulldown (neutral)':'Back','Seated cable row':'Back','Single-arm dumbbell row':'Back',
  'Triceps pushdown':'Arms','Overhead cable triceps extension':'Arms','Incline dumbbell curl':'Arms'
};
const MUSCLE_ORDER = ['Quads','Hamstrings','Glutes','Calves','Chest','Back','Shoulders','Arms','Core'];
const LOWER_MUSCLES = ['Quads','Hamstrings','Glutes','Calves'];
const STATES = {
  good:{label:'Feeling good',sub:'Full session',cls:'good',banner:'Full program. Keep the breathing rules: exhale through the hard part, sit before you stand.'},
  mild:{label:'A bit off',sub:'Modified',cls:'warn',banner:'Modified session: one fewer top set, machines/dumbbells swapped in, longer rests. Eat and drink before you start.'},
  dizzy:{label:'Dizzy',sub:'Light / recovery',cls:'bad',banner:'Light session only: seated and machine work, 2 sets each, nothing heavy. If dizziness hits mid-session, stop and follow the steps below. Skipping today is also a good choice.'}
};

/* ========== STORAGE ========== */
const LS = {sessions:'liftlog.sessions',active:'liftlog.active',settings:'liftlog.settings'};
const load = (k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const save = (k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let sessions = load(LS.sessions,[]);
let active = load(LS.active,null);
let settings = load(LS.settings,{unit:'kg'});

/* ========== HELPERS ========== */
const $ = s=>document.querySelector(s);
const esc = s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const todayISO = ()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const fmtDate = iso=>new Date(iso+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
const exLink = n=>`<a class="howto" target="_blank" rel="noopener" href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(n.replace(/\s*\(.*?\)/g,'')+' exercise form')}">You dunno this exercise? 🔗</a>`;
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function weekKey(iso){const d=new Date(iso+'T12:00:00');const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return d.toISOString().slice(0,10)}
function buildExercise(ex,state){
  let e = {name:ex.name,equip:ex.equip,sets:ex.sets,reps:ex.reps,rest:ex.rest,note:ex.note||'',swapped:false};
  if(state==='mild' && ex.mild){
    if(ex.mild.name && ex.mild.name!==ex.name) e.swapped=ex.name;
    Object.assign(e,ex.mild);
    if(!e.rest) e.rest=ex.rest;
  }
  if(state==='dizzy'){ if(ex.mild){ if(ex.mild.name && ex.mild.name!==ex.name) e.swapped=ex.name; Object.assign(e,ex.mild);} e.sets=2; e.rest='2–3 min'; }
  return e;
}
function planFor(dayKey,state){
  const day = PROGRAM[dayKey];
  let list = day.exercises;
  if(state==='dizzy') list = list.filter(x=>x.dizzyOnly);
  return list.map(x=>buildExercise(x,state));
}
function lastPerformance(name){
  for(let i=sessions.length-1;i>=0;i--){
    const ex = sessions[i].exercises.find(e=>e.name===name);
    if(ex){ const done=ex.sets.filter(s=>s.done&&s.weight!==''&&s.reps!==''); if(done.length){ const best=done.reduce((a,b)=>(+b.weight>+a.weight?b:a)); return {date:sessions[i].date,weight:best.weight,reps:best.reps,equip:ex.equip,sets:done.length}; } }
  }
  return null;
}
function nextDayKey(){
  const done = sessions.filter(s=>s.exercises.some(e=>e.sets.some(x=>x.done)));
  if(!done.length) return 'lowerA';
  const last = done[done.length-1].dayKey;
  return DAY_ORDER[(DAY_ORDER.indexOf(last)+1)%4];
}

/* ========== VIEWS ========== */
let tab='today';
const TABS=['today','insights','history','program','settings'];
function go(t){ if(location.hash.slice(1)!==t) location.hash=t; else render(); }
function readHash(){ const h=location.hash.slice(1); tab=TABS.includes(h)?h:'today'; }
window.addEventListener('hashchange',()=>{readHash();render();window.scrollTo(0,0)});
function render(){
  $('#today').textContent = new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  $('#title').textContent = {today:'Today',insights:'Insights',history:'History',program:'Program',settings:'Settings'}[tab];
  const app=$('#app');
  if(tab==='today') app.innerHTML = active ? viewWorkout() : viewCheckin();
  if(tab==='insights') app.innerHTML = viewInsights();
  if(tab==='history') app.innerHTML = viewHistory();
  if(tab==='program') app.innerHTML = viewProgram();
  if(tab==='settings') app.innerHTML = viewSettings();
  bind();
}

let checkin = {state:null,dayKey:nextDayKey()};
function viewCheckin(){
  const todays = sessions.filter(s=>s.date===todayISO());
  return `
  <div class="card">
    <h2>How are you feeling?</h2>
    <div class="chips" id="stateChips">
      ${Object.entries(STATES).map(([k,v])=>`<button class="chip ${v.cls} ${checkin.state===k?'on':''}" data-state="${k}">${v.label}<small>${v.sub}</small></button>`).join('')}
    </div>
  </div>
  <div class="card">
    <h2>Which session?</h2>
    <div class="chips" id="dayChips">
      ${DAY_ORDER.map(k=>`<button class="chip ${checkin.dayKey===k?'on':''}" data-day="${k}">${PROGRAM[k].name}<small>${PROGRAM[k].focus}</small></button>`).join('')}
    </div>
    <p class="muted" style="margin:10px 0 0">Suggested: <b>${PROGRAM[nextDayKey()].name}</b> (next in rotation).</p>
  </div>
  ${todays.length?`<div class="card muted">You already logged ${todays.map(s=>PROGRAM[s.dayKey].name).join(', ')} today.</div>`:''}
  <button class="block" id="startBtn" ${checkin.state?'':'disabled'}>Start session</button>
  <div class="card" style="margin-top:14px">
    <h3>Before you lift</h3>
    <ul class="steps">
      <li>Ate a real meal in the last 2–4 h, with carbs.</li>
      <li>500 ml water + electrolytes in the last hour.</li>
      <li>Extra salt today.</li>
      <li>Period days 1–3: pick "A bit off" even if you feel fine.</li>
    </ul>
  </div>`;
}

function viewWorkout(){
  const st = STATES[active.state];
  const total = active.exercises.reduce((n,e)=>n+e.sets.length,0);
  const done = active.exercises.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0);
  return `
  <div class="banner ${st.cls}"><b>${PROGRAM[active.dayKey].name} · ${st.label}.</b> ${st.banner}</div>
  <div class="card">
    <div class="row"><div class="grow"><b>${done}/${total} sets done</b><div class="muted">Started ${new Date(active.started).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div></div>
      <button class="ghost small" id="dizzyNow">I feel dizzy</button>
      <button class="ghost small" id="switchBtn">${switchOpen?'Close':'Change'}</button></div>
    <div class="${switchOpen?'':'hidden'}" style="margin-top:12px">
      <div class="muted" style="margin-bottom:6px">How are you feeling now?</div>
      <div class="chips">${Object.entries(STATES).map(([k,v])=>`<button class="chip ${v.cls} ${active.state===k?'on':''}" data-switchstate="${k}">${v.label}<small>${v.sub}</small></button>`).join('')}</div>
      <div class="muted" style="margin:12px 0 6px">Session</div>
      <div class="chips">${DAY_ORDER.map(k=>`<button class="chip ${active.dayKey===k?'on':''}" data-switchday="${k}">${PROGRAM[k].name}<small>${PROGRAM[k].focus}</small></button>`).join('')}</div>
      <p class="muted" style="margin:10px 0 0;font-size:12px">Sets you've already logged are kept for any exercise that stays in the plan.</p>
    </div>
  </div>
  <div class="card">
    ${active.exercises.map((e,ei)=>{
      const lp = lastPerformance(e.name);
      return `<div class="ex" data-ei="${ei}">
        <div class="title"><div><b>${esc(e.name)}</b>
          <div class="meta">${e.targetSets} × ${esc(e.reps)} · rest ${esc(e.rest)}</div>
          ${e.swapped?`<div class="swap">Swapped in for ${esc(e.swapped)}</div>`:''}
          ${exLink(e.name)}
          ${lp?`<div class="last">Last: ${lp.weight} ${settings.unit} × ${lp.reps} (${lp.equip}, ${fmtDate(lp.date)})</div>`:''}
        </div>

/* ========== INSIGHTS ========== */
let insightOffset = 0; // 0 = this week, 1 = last week …
function weekStats(wk){
  const list = sessions.filter(s=>weekKey(s.date)===wk);
  const st = {wk,list,sessions:list.length,daysHit:DAY_ORDER.filter(k=>list.some(s=>s.dayKey===k)),
    sets:0,volume:0,upperSets:0,lowerSets:0,upperVol:0,lowerVol:0,muscle:{},dizzy:list.filter(s=>s.gotDizzy).length,
    states:{good:0,mild:0,dizzy:0},skipped:0,minutes:0,prs:[],best:{}};
  list.forEach(s=>{
    st.states[s.state]=(st.states[s.state]||0)+1;
    const isLower = LOWER_DAYS.includes(s.dayKey);
    s.exercises.forEach(e=>{
      const done=e.sets.filter(x=>x.done);
      if(e.skipped||!done.length){st.skipped++;return}
      const vol=done.reduce((m,x)=>m+(+x.weight||0)*(+x.reps||0),0);
      st.sets+=done.length; st.volume+=vol;
      if(isLower){st.lowerSets+=done.length;st.lowerVol+=vol}else{st.upperSets+=done.length;st.upperVol+=vol}
      const m=MUSCLE[e.name]||'Other'; st.muscle[m]=(st.muscle[m]||0)+done.length;
      const top=Math.max(...done.map(x=>+x.weight||0));
      if(!st.best[e.name]||top>st.best[e.name].w) st.best[e.name]={w:top,reps:done.find(x=>+x.weight===top)?.reps||'',equip:e.equip};
    });
  });
  // PRs: top weight this week vs all earlier sessions
  Object.entries(st.best).forEach(([name,b])=>{
    let prev=0;
    sessions.forEach(s=>{ if(s.date<wk) s.exercises.forEach(e=>{ if(e.name===name) e.sets.forEach(x=>{ if(x.done&&+x.weight>prev) prev=+x.weight }) }) });
    if(b.w>0&&b.w>prev) st.prs.push({name,w:b.w,reps:b.reps,prev});
  });
  return st;
}
function bar(label,val,max,sub,cls){
  const pct = max?Math.round(val/max*100):0;
  return `<div style="margin:8px 0"><div class="row" style="justify-content:space-between;font-size:14px"><span>${esc(label)}</span><span class="muted">${sub}</span></div>
    <div style="height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:4px"><div style="width:${pct}%;height:100%;background:${cls||'var(--accent)'}"></div></div></div>`;
}
function verdict(st,prev){
  const lines=[];
  const n=st.daysHit.length;
  if(n>=4) lines.push('✅ All 4 sessions done — the full split is in.');
  else if(n===3) lines.push(`🟡 3 of 4 sessions. Missing: <b>${DAY_ORDER.filter(k=>!st.daysHit.includes(k)).map(k=>PROGRAM[k].name).join(', ')}</b>.`);
  else if(n>0) lines.push(`🔴 ${n} of 4 sessions. Missing: <b>${DAY_ORDER.filter(k=>!st.daysHit.includes(k)).map(k=>PROGRAM[k].name).join(', ')}</b>.`);
  else lines.push('No sessions logged this week.');
  if(st.sets){
    const lp=Math.round(st.lowerSets/st.sets*100);
    if(lp>=60) lines.push(`Leg-heavy week: <b>${lp}%</b> of your working sets were lower body.`);
    else if(lp<=40) lines.push(`Upper-heavy week: <b>${100-lp}%</b> of your working sets were upper body.`);
    else lines.push(`Balanced week: <b>${lp}%</b> lower / <b>${100-lp}%</b> upper by sets.`);
    const top=Object.entries(st.muscle).sort((a,b)=>b[1]-a[1]);
    if(top.length) lines.push(`Most trained: <b>${top[0][0]}</b> (${top[0][1]} sets)${top.length>1?`, least: <b>${top[top.length-1][0]}</b> (${top[top.length-1][1]})`:''}.`);
  }
  if(prev&&prev.volume&&st.volume){
    const d=Math.round((st.volume-prev.volume)/prev.volume*100);
    lines.push(`Total volume ${d>=0?'up':'down'} <b>${Math.abs(d)}%</b> vs last week.`);
  }
  if(st.dizzy) lines.push(`⚠️ Dizziness in <b>${st.dizzy}</b> session${st.dizzy>1?'s':''} (${st.list.filter(s=>s.gotDizzy).map(s=>PROGRAM[s.dayKey].name).join(', ')}). Check the notes for what you ate and when.`);
  else if(st.sessions) lines.push('No dizziness logged. 👍');
  if(st.prs.length) lines.push(`🏆 <b>${st.prs.length}</b> new top weight${st.prs.length>1?'s':''}: ${st.prs.slice(0,3).map(p=>`${esc(p.name)} ${p.w}${settings.unit}`).join(', ')}${st.prs.length>3?'…':''}.`);
  return lines;
}

    <div class="row" style="margin-top:12px;gap:6px;flex-wrap:wrap">

    ${bar('Lower body',st.lowerSets,st.sets,st.lowerSets+' sets · '+Math.round(st.lowerVol).toLocaleString()+' '+u)}

/* ========== EVENTS ========== */
function startSession(){
  const plan = planFor(checkin.dayKey,checkin.state);
  active = {id:uid(),date:todayISO(),started:Date.now(),dayKey:checkin.dayKey,state:checkin.state,notes:'',gotDizzy:false,
    exercises:plan.map(e=>({name:e.name,equip:e.equip,reps:e.reps,rest:e.rest,note:e.note,swapped:e.swapped,targetSets:e.sets,skipped:false,
      sets:Array.from({length:e.sets},()=>({weight:'',reps:'',done:false}))}))};
  save(LS.active,active); render(); window.scrollTo(0,0);
}
let switchOpen=false;
function switchSession(state,dayKey){
  const plan = planFor(dayKey,state);
  const old = Object.fromEntries(active.exercises.map(e=>[e.name,e]));
  active.state=state; active.dayKey=dayKey;
  active.exercises = plan.map(e=>{
    const prev = old[e.name];
    const base = {name:e.name,equip:e.equip,reps:e.reps,rest:e.rest,note:e.note,swapped:e.swapped,targetSets:e.sets,skipped:false,
      sets:Array.from({length:e.sets},()=>({weight:'',reps:'',done:false}))};
    if(prev){ base.equip=prev.equip; base.skipped=prev.skipped;
      const logged=prev.sets.filter(x=>x.done||x.weight!==''||x.reps!=='');
      if(logged.length) base.sets = logged.length>=e.sets ? logged : logged.concat(base.sets.slice(logged.length)); }
    return base;
  });
  switchOpen=false; save(LS.active,active); render(); window.scrollTo(0,0);
}
function finishSession(){
  active.notes = $('#sessNotes').value;
  const any = active.exercises.some(e=>e.sets.some(s=>s.done));
  if(!any && !confirm('No sets marked done. Save anyway?')) return;
  sessions.push(active); save(LS.sessions,sessions);
  active=null; localStorage.removeItem(LS.active);
  checkin={state:null,dayKey:nextDayKey()};
  go('history');
}
function bind(){
  document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.tab));
  document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{checkin.state=b.dataset.state;render()});
  document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{checkin.dayKey=b.dataset.day;render()});
  document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{settings.unit=b.dataset.unit;save(LS.settings,settings);render()});
  const s=$('#startBtn'); if(s) s.onclick=startSession;
  const wp=$('#wkPrev'); if(wp) wp.onclick=()=>{insightOffset++;render()};
  const wn=$('#wkNext'); if(wn) wn.onclick=()=>{insightOffset=Math.max(0,insightOffset-1);render()};
  const f=$('#finishBtn'); if(f) f.onclick=finishSession;
  const d=$('#discardBtn'); if(d) d.onclick=()=>{if(confirm('Discard this session?')){active=null;localStorage.removeItem(LS.active);render()}};
  const sw=$('#switchBtn'); if(sw) sw.onclick=()=>{switchOpen=!switchOpen;render()};
  document.querySelectorAll('[data-switchstate]').forEach(b=>b.onclick=()=>switchSession(b.dataset.switchstate,active.dayKey));
  document.querySelectorAll('[data-switchday]').forEach(b=>b.onclick=()=>{if(b.dataset.switchday===active.dayKey||confirm('Switch to '+PROGRAM[b.dataset.switchday].name+'? Logged sets for exercises not in that session will be dropped.'))switchSession(active.state,b.dataset.switchday)});
  const dz=$('#dizzyNow'); if(dz) dz.onclick=()=>{$('#dizzyCard').classList.remove('hidden');$('#dizzyCard').scrollIntoView({behavior:'smooth'})};
  const n=$('#sessNotes'); if(n) n.oninput=()=>{active.notes=n.value;save(LS.active,active)};
  const ex=$('#exportBtn'); if(ex) ex.onclick=()=>{const blob=new Blob([JSON.stringify({sessions,settings},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`heavy-not-dizzy-${todayISO()}.json`;a.click()};
  const im=$('#importFile'); if(im) im.onchange=e=>{const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!Array.isArray(j.sessions))throw 0;const ids=new Set(sessions.map(s=>s.id));j.sessions.forEach(s=>{if(!ids.has(s.id))sessions.push(s)});sessions.sort((a,b)=>a.date.localeCompare(b.date)||a.started-b.started);save(LS.sessions,sessions);alert('Imported.');render()}catch(_){alert('That file is not an Iron Issues backup.')}};r.readAsText(e.target.files[0])};
  const w=$('#wipeBtn'); if(w) w.onclick=()=>{if(confirm('Delete every session? This cannot be undone.')){sessions=[];save(LS.sessions,sessions);active=null;localStorage.removeItem(LS.active);render()}};

  document.querySelectorAll('[data-act]').forEach(el=>{
    const act=el.dataset.act, ei=+el.dataset.ei, si=+el.dataset.si;
    const persist=()=>save(LS.active,active);
    if(act==='w') el.oninput=()=>{active.exercises[ei].sets[si].weight=el.value;persist()};
    if(act==='r') el.oninput=()=>{active.exercises[ei].sets[si].reps=el.value;persist()};
    if(act==='equip') el.onchange=()=>{active.exercises[ei].equip=el.value;persist()};
    if(act==='done') el.onclick=()=>{const st=active.exercises[ei].sets[si];st.done=!st.done;
      if(st.done){const lp=lastPerformance(active.exercises[ei].name);if(st.weight===''&&lp)st.weight=lp.weight;if(st.reps===''&&si>0)st.reps=active.exercises[ei].sets[si-1].reps;}
      persist();render()};
    if(act==='addset') el.onclick=()=>{const sets=active.exercises[ei].sets;const p=sets[sets.length-1]||{};sets.push({weight:p.weight||'',reps:p.reps||'',done:false});persist();render()};
    if(act==='rmset') el.onclick=()=>{active.exercises[ei].sets.pop();persist();render()};
    if(act==='skip') el.onclick=()=>{active.exercises[ei].skipped=!active.exercises[ei].skipped;persist();render()};
    if(act==='logdizzy') el.onclick=()=>{active.gotDizzy=true;persist();if(active.state!=='dizzy'&&confirm('Marked. Switch the rest of this session to the light version?'))switchSession('dizzy',active.dayKey);else render()};
    if(act==='delsess') el.onclick=()=>{if(confirm('Delete this session?')){sessions=sessions.filter(s=>s.id!==el.dataset.id);save(LS.sessions,sessions);render()}};
  });
}
readHash(); render();
</script>
</body>
</html>
